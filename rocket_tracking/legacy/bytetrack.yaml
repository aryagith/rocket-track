# ByteTrack configuration for rocket tracking

tracker_type: bytetrack

# Detection thresholds
track_high_thresh: 0.5    # High confidence detections
track_low_thresh: 0.1     # Low confidence for track recovery
new_track_thresh: 0.6     # Threshold to start new track
track_buffer: 30          # Frames to keep lost tracks (1 sec at 30fps)
match_thresh: 0.8         # IoU threshold for matching

# Frame rate
frame_rate: 30