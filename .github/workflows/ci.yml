name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lightweight test deps
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24" "scipy>=1.11" "opencv-python-headless>=4.8" "matplotlib>=3.7" pytest
          # backends availability probe imports torch/onnxruntime optionally
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install onnxruntime

      - name: Unit tests (no GPU / no Ultralytics required)
        env:
          PYTHONPATH: src:.
        run: python -m pytest tests/test_sort.py tests/test_backends.py tests/test_pipeline_smoke.py -q
